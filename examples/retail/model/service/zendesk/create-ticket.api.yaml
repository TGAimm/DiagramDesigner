request:
  fields:
    - { id: hr83hpuq5x, name: ticket.subject, type: string, to: [fzltpmlpbj] }
    - { id: s6uhoq5zos, name: ticket.comment.body, type: string, required: true, to: [bk1ohm0lpm] }
    - { id: m9o4m2u6ly, name: ticket.comment.public, type: bool, to: [tk1mnunpmq] }
    - { id: kj9hqa3394, name: ticket.requester.name, type: string, to: [c4oj8pr2yl] }
    - { id: i7ald6gxzh, name: ticket.requester.email, type: string, required: true, to: [fvt97h71xi], description: creates the end-user if new }
    - { id: s1fpx384gp, name: ticket.priority, type: string, to: [zkrrsnbrh2] }
    - { id: kfvb4k2udg, name: ticket.group_id, type: int, to: [k08deeouym] }
    - { id: ouetrtv4oo, name: ticket.tags, type: string, many: true, to: [maigyjjtjt] }
