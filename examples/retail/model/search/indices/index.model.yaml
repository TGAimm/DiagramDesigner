# Fjeld runs one primary index per webshop locale (products_da_dk, products_sv_se,
# products_nb_no, products_de_de) and three sort replicas per primary (_price_asc,
# _price_desc, _newest): 16 indices, one record shape.
# GAP: one record shape in many indices - written as one Index model (a row per index) and one
# Product Record keyed by indexName; that a replica is a full copy of its primary's records,
# kept by Algolia and re-sorted by its own ranking, can't be said with from or storedIn.
id: xb9pymmha0
