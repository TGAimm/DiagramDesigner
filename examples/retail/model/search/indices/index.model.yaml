storedIn: u4435mqo47
name: Index
fields:
  - { id: fwm01mcigb, name: name, type: string, pk: true, constraints: ["products_<locale>, or products_<locale>_<sort> for a replica"] }
  - { id: lps2y7mqci, name: locale, type: string, required: true, constraints: ["one of: da_dk, sv_se, nb_no, de_de"] }  # GAP: enum
  - { id: srj1lavgck, name: primary, type: string, nullable: true, ref: fwm01mcigb, constraints: ["set on a replica: the index it copies"] }
  - { id: wy898j0nmd, name: replicas, type: string, many: true, ref: fwm01mcigb, from: [juff29tl9w] }
  - { id: l3wlqditi9, name: entries, type: int, required: true, constraints: ["about 9,000 colour records per locale"] }
  - { id: huj5cogdd7, name: dataSize, type: long, required: true, constraints: [bytes] }
  - { id: cayfnug6vg, name: lastBuildTimeS, type: int, required: true }
  - { id: qfovlwxpng, name: pendingTask, type: bool, required: true, from: [c4sgr17xab], derived: any task of the index not yet published }
  - { id: len1zuvl9o, name: createdAt, type: datetime, required: true }
  - { id: gl2n9t5g5c, name: updatedAt, type: datetime, required: true }
indexes:
