# One record per style and colour (FJ-JKT-1042-RED), with its sizes as a list: the grid shows
# colours, not sizes. Written by Integration through the batch api from the PIM export (content),
# Commerce prices and Commerce inventory (stock), one locale's index at a time.
# GAP: lineage by attribute - name, brand, colour and size come from the PIM Product DTO, which
# already says which attribute each column holds; the Commerce price and stock lineage can't say
# "for the index's country" or "for the webshop channel": that is in derived only.
