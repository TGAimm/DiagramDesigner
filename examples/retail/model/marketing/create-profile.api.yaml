  fields:
    - { id: icnh7tx5bl, name: data.attributes.email, type: string, to: [twxat301yi] }
    - { id: wx67zh9qxr, name: data.attributes.phone_number, type: string, to: [wpaulnuzqr] }
    - { id: v1wk752g8l, name: data.attributes.external_id, type: string, to: [zctmivg3ti] }
    - { id: p54vyj4nxp, name: data.attributes.first_name, type: string, to: [grqe6j9ww3] }
    - { id: tl17o1hgsl, name: data.attributes.last_name, type: string, to: [e1sejzfw72] }
    - { id: sp31025lih, name: data.attributes.locale, type: string, to: [wcudflqpqm] }
    - { id: kz7z8zge5u, name: data.attributes.properties, model: xup7zenrv4 }
responses:
  - { status: 201, model: apj02aeekt }
  - { status: 400, model: s4w1d8x1z4 }
  - { status: 409, model: s4w1d8x1z4, description: "duplicate_profile; meta.duplicate_profile_id names the existing one" }
