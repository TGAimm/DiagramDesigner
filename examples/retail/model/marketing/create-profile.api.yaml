name: Create profile
method: POST
path: /api/profiles
auth: "Klaviyo-API-Key private key (scope profiles:write)"
params:
  - { id: jeyyfllrey, name: revision, in: header, type: string, required: true }
# GAP: nested body (JSON:API puts the fields under data.attributes; own-shape fields are flat, so the path is written in the name)
request:
