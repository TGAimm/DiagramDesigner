name: List products
method: GET
path: /api/rest/v1/products-uuid
auth: bearer
params:
  - { id: s8hbelue5i, name: search, in: query, type: json, required: false, description: "filters, e.g. {\"updated\":[{\"operator\":\">\",\"value\":\"2026-11-17 00:00:00\"}],\"enabled\":[{\"operator\":\"=\",\"value\":true}],\"completeness\":[{\"operator\":\"=\",\"value\":100,\"scope\":\"ecommerce\"}]}" }
  - { id: zsmmjo86sa, name: scope, in: query, type: string, required: false, description: only values of this channel }
  - { id: v8oh10eiqm, name: locales, in: query, type: string, required: false, description: comma-separated locale codes }
  - { id: agqn2bww36, name: attributes, in: query, type: string, required: false, description: comma-separated attribute codes to return }
  - { id: xeghvu3rah, name: pagination_type, in: query, type: string, required: false, description: "page (default) or search_after" }
