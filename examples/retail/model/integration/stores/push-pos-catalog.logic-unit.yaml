# GAP: scheduled trigger
# ERP items and store prices > the POS product catalogue (nightly, before the stores open).
id: gd71igzb7k
parent: nlc4zljjz8
name: pushPosCatalog
meta: { schedule: "0 5 * * *" }
inputs: []
outputs: []
steps:
  - { read: nanvethhnv, with: erp / items-pos, gets: cursor }
  - { call: q2t4rbs6gu, with: "$filter lastModifiedDateTime gt cursor and type eq 'Inventory'", gets: items }
  - each: item
    do:
      - { call: bszf4fnonm, with: item.id, gets: variants }
      - { read: dcsafzlsgm, with: "sku, priceListCode STORE-<currency>, CAMPAIGN-*", gets: store prices }
  - { call: xscci9evvo, with: "batches of 500: sku, ean, name, variantText, category, vatRate per country, prices, active = not blocked", gets: result }
  - if: 207 with failed rows
    then:
      - { write: wlmvgl2qp8, note: "one row per failed sku, retryable false" }
  - { write: nanvethhnv, note: "highest lastModifiedDateTime" }
