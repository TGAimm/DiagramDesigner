# The 3PL's graded returns go to the returns portal as inspected; its status webhook then
# starts the credit memo and refund (onReturnStatusChanged).
id: pjrw9c5dai
parent: sicmj00m5m
name: processReturnReceipts
handles: [hcy7xc6ylp]
inputs: []
outputs: []
steps:
  - { note: "list /fjeld/out for RETURNRCPT_*.csv" }
  - each: file
    do:
      - { read: gkqoftgixd, gets: rows }
      - { read: cc1v719mlz, with: sha256, gets: seen before }
      - if: not seen before
        then:
          - each: return in rows grouped by rma_number
            do:
              - { read: r1iwd1t2bt, with: rma_number, gets: ids }
              - if: no ids (unannounced return)
                then:
                  - { call: q6xacaktb8, with: "subject 'Unannounced return at the 3PL', group Returns, the rows as an internal note", gets: ticket }
                else:
                  - { call: i7qgposvm6, with: "status inspected; per item inspection_result from grade (A, B > accepted; C > accepted_damaged; D > rejected), restock from disposition", gets: return }
                  - { write: r1iwd1t2bt, note: "status received" }
          - { write: cc1v719mlz, note: "archive/wms-out/…/RETURNRCPT_<ts>.csv" }
      - { note: "move the file to /fjeld/archive" }
