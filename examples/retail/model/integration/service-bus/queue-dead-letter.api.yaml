# Messages that will never succeed: retries exhausted, or a 400 from the target.
# GAP: Service Bus has a dead-letter subqueue per entity; Fjeld forwards them all to one queue the ops API reads.
id: gxh7trguok
parent: g55sb0eqd6
name: Queue dead-letter
method: POST
path: /queues/dead-letter
auth: "Entra ID managed identity (Azure Service Bus Data Sender)"
params:
  - { id: ihucdndz5o, name: BrokerProperties, in: header, type: json, required: false, description: "MessageId, CorrelationId, Label, ScheduledEnqueueTimeUtc" }
request: { model: vxed7chciz }
responses:
  - { status: 201, description: Enqueued }
  - { status: 400, description: Malformed body or properties }
  - { status: 401, description: Missing or expired token }
  - { status: 403, description: "Quota exceeded, or message over 256 KB" }
  - { status: 410, description: The topic or queue does not exist }
  - { status: 503, description: "Busy (throttled): retry with backoff" }
