parent: g55sb0eqd6
name: Queue pim-full-sync
method: POST
path: /queues/pim-full-sync
auth: "Entra ID managed identity (Azure Service Bus Data Sender)"
params:
  - { id: naiyubq4cm, name: BrokerProperties, in: header, type: json, required: false, description: "MessageId, CorrelationId, Label, ScheduledEnqueueTimeUtc" }
request: { model: no6pifpr62 }
responses:
  - { status: 201, description: Enqueued }
