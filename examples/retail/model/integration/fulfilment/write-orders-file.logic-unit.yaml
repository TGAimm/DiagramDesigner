# GAP: drains queue wms-outbound-orders on a timer, up to 500 at a time (batch receive), not per message
id: tym2hdmo28
parent: myr8ju3xsr
name: writeOrdersFile
handles: [jhj7qu6oig]
when: { flag: exafkh0xzs, is: off }
inputs: []
outputs: []
steps:
  - { note: "receive up to 500 messages from wms-outbound-orders (peek-lock)" }
  - if: none
    then:
      - { note: "no file: the 3PL does not want empty files" }
    else:
      - { write: l03dfm19e0, note: "ORDERS_<yyyyMMddHHmmss>.csv to /fjeld/in: one row per order line, ';'-separated, UTF-8; written as .tmp then renamed so the 3PL never reads half a file" }
      - { write: cc1v719mlz, note: "archive/wms-in/…/ORDERS_<ts>.csv" }
      - { note: "complete the messages; on an SFTP error abandon them, they come back next run" }
      - { write: yguluhbf6w, note: "one row per order: channel sftp:ORDERS_<ts>.csv, targetSystem wms" }
