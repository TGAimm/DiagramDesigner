  - { id: lf9qf4geax, name: channel_code, type: string, required: true, from: [jyonhj34gj], derived: "channel of the original order; store when the original is unknown" }
  - { id: grm9p5zbz9, name: returned_to, type: string, required: true, constraints: ["one of: warehouse, store"] } # GAP: enum
