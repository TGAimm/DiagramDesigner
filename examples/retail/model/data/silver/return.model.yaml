  - { id: z6ooiptajb, name: refund_amount, type: decimal, nullable: true, from: [b1nlpddm21, cd1t16hxej, wrew270gti], derived: "sold line gross / sold quantity * returned quantity; POS: - lineTotal. The Stripe refund is per order, not per line" }
