# SCD2: a new version when a tracked column changes (row_hash); valid_to closes the old one.
# GAP: SCD2 history - versioning is a table pattern (valid_from/valid_to/is_current, key reused
# across rows) the schema cannot state; pk is the surrogate, the business key is an index.
# GAP: survivorship - a column fed by several sources with a precedence rule; `from` lists
# them all, the precedence lives only in `derived`.
