# CI for the viewer itself: lint, types and unit tests with coverage.
name: Tool

on:
  push:
    paths: ['tool/**', 'examples/**', '.github/workflows/tool.yml']
  pull_request:
    paths: ['tool/**', 'examples/**', '.github/workflows/tool.yml']

defaults:
  run:
    working-directory: tool

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check
      - name: Unit tests (coverage gate 80% lines for model and landscape)
        run: bun run test:coverage
      - name: Validate the example designs
        run: |
          node cli/bin.js validate --root ../examples/commerce
          node cli/bin.js validate --root ../examples/retail
